    <style>
      /* Native app: status bar iOS gestita da apple-mobile-web-app-status-bar-style=default
         (iOS pusha il contenuto sotto status bar automaticamente). Body FFFFFF
         evita gap grigio visibile tra status bar e AppBar bianca. */
      html, body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        background: #FFFFFF;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        min-height: 100vh;
        min-height: 100dvh;
        width: 100%;
        overflow-x: hidden;
      }
      /* Blocca doppio tap zoom su iOS in webview */
      * {
        touch-action: manipulation;
      }
    </style>
