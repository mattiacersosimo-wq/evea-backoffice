name: Android Play Store Release (Backoffice)

# Builds a signed AAB and uploads it to Google Play Internal Testing.
# Runs only on manual trigger (workflow_dispatch).
#
# REQUIRED GITHUB SECRETS (Settings -> Secrets and variables -> Actions):
#
#   GOOGLE_SERVICES_JSON             - raw content of google-services.json
#   ANDROID_KEYSTORE_B64             - base64 of the .jks release keystore
#   ANDROID_KEYSTORE_PASSWORD        - store password
#   ANDROID_KEY_ALIAS                - alias of the release key
#   ANDROID_KEY_PASSWORD             - key password (often same as store)
#   PLAY_SERVICE_ACCOUNT_JSON        - Play Console service account JSON (opz.)

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'What is new in this build (shown in Play Internal Testing)'
        required: false
        default: 'Internal build'
      upload_to_play:
        description: 'Upload to Play Store Internal Testing after build?'
        required: false
        default: 'false'
        type: choice
        options: [ 'false', 'true' ]

jobs:
  build-android-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JS deps
        run: npm ci --legacy-peer-deps

      - name: Build web (production)
        run: CI=false npm run build

      - name: Scaffold Android project (Capacitor)
        run: npx cap add android || true

      - name: Generate Android icon + splash
        run: npx capacitor-assets generate --android --iconBackgroundColor "#FFFFFF" --iconBackgroundColorDark "#FFFFFF" --splashBackgroundColor "#FFFFFF" --splashBackgroundColorDark "#FFFFFF"

      - name: Sync web assets + plugins into android/
        run: npx cap sync android

      - name: Write google-services.json
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GS_JSON" > android/app/google-services.json
          echo "google-services.json written ($(wc -c < android/app/google-services.json) bytes)"

      - name: Decode release keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p android/app
          echo -n "$KS_B64" | base64 --decode > android/app/evea-release.jks

      - name: Bump Android versionCode
        run: |
          BUILD_GRADLE=android/app/build.gradle
          sed -i.bak "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" "$BUILD_GRADLE"
          grep -E 'versionCode|versionName' "$BUILD_GRADLE"

      - name: Inject release signing config into build.gradle
        run: |
          python3 <<'PY'
          import re
          p = 'android/app/build.gradle'
          src = open(p).read()
          if 'signingConfigs' in src and 'evea-release.jks' in src:
              print('signing config already present')
          else:
              sign_block = """
              signingConfigs {
                  release {
                      storeFile file('evea-release.jks')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
              }
          """
              src = re.sub(r'(android\s*\{)', r'\1\n' + sign_block, src, count=1)
              if re.search(r'buildTypes\s*\{\s*release\s*\{[^}]*minifyEnabled', src):
                  src = re.sub(r'(buildTypes\s*\{\s*release\s*\{)', r"\1\n            signingConfig signingConfigs.release", src, count=1)
              open(p, 'w').write(src)
              print('signing config injected')
          PY

      - name: Prepare whatsnew for Play Store
        run: |
          mkdir -p android/whatsnew
          printf '%s' "${{ inputs.release_notes }}" > android/whatsnew/whatsnew-it-IT
          printf '%s' "${{ inputs.release_notes }}" > android/whatsnew/whatsnew-en-US

      - name: Build signed release AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon
          find app/build/outputs/bundle/release -name '*.aab' -exec ls -lh {} \;

      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: eVea-Backoffice-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Play Console Internal Testing
        if: ${{ inputs.upload_to_play == 'true' && env.PLAY_SA_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        env:
          PLAY_SA_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.evea.backoffice
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: draft
          whatsNewDirectory: android/whatsnew
          inAppUpdatePriority: 3
